# Compila e empacota o port para macOS (universal, Intel e Apple Silicon) e roda os testes.
# Disparo manual (Actions > macOS > Run workflow) ou ao publicar uma tag "v*". Nenhum dado do jogo é usado ou distribuído.
name: macOS

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  empacotar:
    name: Empacotar (universal, x86_64 e arm64)
    # O runner Intel compila as duas arquiteturas (o Xcode gera o arm64 por cross-compilação); os testes rodam em x86_64 nativo.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Dependências
        run: brew install cmake ninja
      - name: Compilar, testar (x86_64) e gerar os .dmg
        run: tools/package/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dracula-x-macos
          path: dist/*.dmg
          if-no-files-found: error

  testes-apple-silicon:
    name: Testes no Apple Silicon (arm64 nativo)
    runs-on: macos-latest
    continue-on-error: true   # este tipo de runner pode não estar disponível para a conta
    steps:
      - uses: actions/checkout@v4
      - name: Dependências
        run: brew install cmake ninja
      - name: Compilar e rodar a suíte
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target tests
          build/tests/tests
